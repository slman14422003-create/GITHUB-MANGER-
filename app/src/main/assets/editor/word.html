<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>محرر Word</title>
<style>
:root{--bg:#E6E8EC;--rib:#F3F4F6;--ribline:#D0D3D9;--btn:#E1E4E9;--btnh:#D0D5DC;--act:#BFD6F5;--ink:#1F2328;--acc:#185ABD;--sheet:#fff;--mut:#6b7280}
body.night{--bg:#16181c;--rib:#23262b;--ribline:#3a3e45;--btn:#2f3339;--btnh:#3b4048;--act:#2d4a75;--ink:#E6E8EB;--acc:#7FB0FF;--mut:#9aa1ab}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.4 "Segoe UI",Roboto,"Noto Sans Arabic",Arial,sans-serif}
#app{display:flex;flex-direction:column;height:100%}
#tabs{display:flex;background:var(--acc);overflow-x:auto;flex:none;scrollbar-width:none}
#tabs button{flex:none;border:0;background:transparent;color:#fff;padding:8px 14px;font:inherit;cursor:pointer;opacity:.85}
#tabs button.on{background:var(--rib);color:var(--ink);opacity:1;border-radius:6px 6px 0 0;font-weight:600}
body.night #tabs button{color:#0b1b33}
body.night #tabs button.on{color:var(--ink)}
#ribbon{background:var(--rib);border-bottom:1px solid var(--ribline);flex:none;overflow-x:auto;white-space:nowrap;scrollbar-width:none;padding:4px 4px}
.pane{display:none;align-items:stretch}
.pane.on{display:inline-flex}
.grp{display:inline-flex;align-items:center;gap:3px;padding:0 6px;border-inline-end:1px solid var(--ribline);min-height:40px}
.grp:last-child{border:0}
.rb{min-width:34px;height:34px;border:0;border-radius:5px;background:transparent;color:var(--ink);font:inherit;font-size:15px;cursor:pointer;padding:0 7px;display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
.rb:active,.rb:hover{background:var(--btnh)}
.rb.on{background:var(--act)}
.rb small{font-size:11px;color:var(--mut)}
.rb.lbl{font-size:13px}
select.rs,input.rs{height:32px;border:1px solid var(--ribline);border-radius:5px;background:var(--sheet);color:var(--ink);font:inherit;font-size:13px;padding:0 4px;max-width:130px}
body.night select.rs{background:#2b2e34}
.swatch{display:inline-block;width:16px;height:4px;border-radius:2px;margin-top:2px}
#wrap{flex:1;overflow:auto;position:relative;padding:12px 6px 60px;-webkit-overflow-scrolling:touch}
#zoomer{transform-origin:top center;margin:0 auto;width:max-content;max-width:none}
#sheet{background:var(--sheet);color:#1F1E1D;margin:0 auto;box-shadow:0 1px 4px rgba(0,0,0,.25);position:relative;width:794px;min-height:600px}
body.night #sheet{filter:invert(1) hue-rotate(180deg)}
body.night #sheet img{filter:invert(1) hue-rotate(180deg)}
.hf{color:#888;font-size:12px;min-height:0;padding:0;outline:none;text-align:center;border:0}
.hf:empty{display:none}
#page{outline:none;min-height:400px;font:11pt/1.5 Calibri,"Segoe UI",Roboto,"Noto Sans Arabic",Arial,sans-serif;overflow-wrap:anywhere;caret-color:#185ABD}
#page p{margin:0 0 8px}
#page h1{font-size:20pt;margin:12px 0 6px}#page h2{font-size:16pt;margin:10px 0 6px}#page h3{font-size:13pt;margin:8px 0 4px}
#page .ttl{font-size:26pt;font-weight:300;margin:0 0 10px}
#page blockquote.q{margin:8px 24px;padding:4px 12px;border-inline-start:3px solid #aab;color:#555;font-style:italic}
#page table{border-collapse:collapse;width:100%;margin:6px 0}
#page td,#page th{padding:4px 6px;vertical-align:top;min-width:24px}
#page table.nb td,#page table.nb th{outline:1px dashed #d4d4d4}
#page img{max-width:100%;height:auto}
#page img.sel{outline:2px solid #185ABD}
#page .speaking{outline:2px solid #E8590C;background-image:linear-gradient(rgba(255,213,0,.3),rgba(255,213,0,.3))}
#page ul,#page ol{margin:0 0 8px;padding-inline-start:28px}
.pbk{display:block;border-top:2px dashed #99a;margin:10px 0;height:0;page-break-after:always}
.pbk::after{content:"فاصل صفحة";display:block;font-size:10px;color:#99a;text-align:center;margin-top:-8px;background:#fff;width:70px;margin-inline:auto}
#status{flex:none;background:var(--rib);border-top:1px solid var(--ribline);display:flex;gap:14px;align-items:center;padding:3px 10px;font-size:12px;color:var(--mut)}
#status .sp{flex:1}
#status button{border:0;background:transparent;color:var(--ink);font-size:16px;padding:0 6px}
#imgtb{position:absolute;display:none;background:var(--rib);border:1px solid var(--ribline);border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.3);z-index:20;padding:2px}
#pal{position:fixed;display:none;z-index:50;background:var(--rib);border:1px solid var(--ribline);border-radius:8px;padding:8px;box-shadow:0 4px 14px rgba(0,0,0,.35);width:218px}
#pal .c{display:inline-block;width:20px;height:20px;margin:1px;border:1px solid rgba(0,0,0,.25);border-radius:3px}
#pal .row{margin-top:6px;display:flex;gap:6px;align-items:center}
#mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:60;align-items:center;justify-content:center}
#dlg{background:var(--rib);color:var(--ink);border-radius:10px;padding:14px;min-width:270px;max-width:92vw;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#dlg h3{margin:0 0 10px;font-size:16px}
#dlg label{display:block;margin:8px 0 3px;font-size:13px;color:var(--mut)}
#dlg input,#dlg select{width:100%;height:36px;border:1px solid var(--ribline);border-radius:6px;padding:0 8px;background:var(--sheet);color:var(--ink);font:inherit}
#dlg .bt{display:flex;gap:8px;margin-top:14px;justify-content:flex-start}
#dlg .bt button{height:36px;padding:0 18px;border-radius:6px;border:1px solid var(--ribline);background:var(--btn);color:var(--ink);font:inherit}
#dlg .bt button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
body.night #dlg .bt button.p{color:#0b1b33}
#toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;display:none;z-index:80}
#findbar{display:none;background:var(--rib);border-bottom:1px solid var(--ribline);padding:5px 8px;gap:6px;align-items:center;flex-wrap:wrap}
#findbar input{height:32px;border:1px solid var(--ribline);border-radius:5px;padding:0 8px;background:var(--sheet);color:var(--ink);font:inherit;width:130px}
</style>
</head>
<body>
<div id="app">
  <div id="tabs">
    <button data-p="home" class="on">الرئيسية</button><button data-p="ins">إدراج</button><button data-p="tbl">الجدول</button><button data-p="lay">التخطيط</button><button data-p="rev">مراجعة</button><button data-p="view">عرض</button>
  </div>
  <div id="ribbon">
    <div class="pane on" id="p-home">
      <div class="grp">
        <button class="rb" data-a="undo" title="تراجع">↶</button><button class="rb" data-a="redo" title="إعادة">↷</button>
      </div>
      <div class="grp">
        <select class="rs" id="fontSel" title="الخط"></select>
        <select class="rs" id="sizeSel" style="width:62px" title="الحجم"></select>
        <button class="rb" data-a="sizeUp" title="تكبير">A▲</button><button class="rb" data-a="sizeDn" title="تصغير">A▼</button>
      </div>
      <div class="grp">
        <button class="rb" data-a="bold" title="عريض"><b>B</b></button>
        <button class="rb" data-a="italic" title="مائل"><i>I</i></button>
        <button class="rb" data-a="underline" title="تسطير"><u>U</u></button>
        <button class="rb" data-a="strikeThrough" title="يتوسطه خط"><s>S</s></button>
        <button class="rb" data-a="subscript" title="منخفض">x₂</button>
        <button class="rb" data-a="superscript" title="مرتفع">x²</button>
        <button class="rb" data-a="fore" title="لون الخط"><span>A<br><span class="swatch" id="swFore" style="background:#d00"></span></span></button>
        <button class="rb" data-a="hilite" title="تمييز"><span>🖍<br><span class="swatch" id="swHi" style="background:#ff0"></span></span></button>
        <button class="rb" data-a="clear" title="مسح التنسيق">✕A</button>
      </div>
      <div class="grp">
        <button class="rb" data-a="ul" title="نقاط">•≡</button><button class="rb" data-a="ol" title="ترقيم">1≡</button>
        <button class="rb" data-a="outdent" title="تقليل المسافة البادئة">⇤</button><button class="rb" data-a="indent" title="زيادة المسافة البادئة">⇥</button>
      </div>
      <div class="grp">
        <button class="rb" data-a="alignL" title="يسار">⯇≡</button><button class="rb" data-a="alignC" title="توسيط">≡</button><button class="rb" data-a="alignR" title="يمين">≡⯈</button><button class="rb" data-a="alignJ" title="ضبط">☰</button>
        <button class="rb lbl" data-a="rtl" title="اتجاه من اليمين">¶◂</button><button class="rb lbl" data-a="ltr" title="اتجاه من اليسار">▸¶</button>
      </div>
      <div class="grp">
        <select class="rs" id="styleSel" title="النمط">
          <option value="p">عادي</option><option value="title">عنوان رئيسي</option><option value="h1">عنوان 1</option><option value="h2">عنوان 2</option><option value="h3">عنوان 3</option><option value="q">اقتباس</option>
        </select>
      </div>
      <div class="grp">
        <button class="rb" data-a="speak" title="قراءة صوتية">🔊 <small>قراءة</small></button>
        <button class="rb" data-a="find" title="بحث">🔍</button>
      </div>
    </div>
    <div class="pane" id="p-ins">
      <div class="grp"><button class="rb lbl" data-a="insTable">▦ جدول</button><button class="rb lbl" data-a="insImage">🖼 صورة</button><button class="rb lbl" data-a="insLink">🔗 رابط</button></div>
      <div class="grp"><button class="rb lbl" data-a="insHr">― خط أفقي</button><button class="rb lbl" data-a="insPb">⤓ فاصل صفحة</button><button class="rb lbl" data-a="insDate">📅 تاريخ</button><button class="rb lbl" data-a="insSym">Ω رمز</button></div>
      <div class="grp"><button class="rb lbl" data-a="insHdr">ترويسة</button><button class="rb lbl" data-a="insFtr">تذييل</button><button class="rb lbl" data-a="insPn" id="btnPn">رقم الصفحة</button></div>
    </div>
    <div class="pane" id="p-tbl">
      <div class="grp"><button class="rb lbl" data-a="rowUp">صف ↑</button><button class="rb lbl" data-a="rowDn">صف ↓</button><button class="rb lbl" data-a="colBef">عمود ›</button><button class="rb lbl" data-a="colAft">عمود ‹</button></div>
      <div class="grp"><button class="rb lbl" data-a="delRow">حذف صف</button><button class="rb lbl" data-a="delCol">حذف عمود</button><button class="rb lbl" data-a="delTbl">حذف الجدول</button></div>
      <div class="grp"><button class="rb lbl" data-a="mergeR">دمج مع التالية</button><button class="rb lbl" data-a="mergeD">دمج مع الأسفل</button><button class="rb lbl" data-a="splitC">فصل</button></div>
      <div class="grp"><button class="rb lbl" data-a="cellBg">🎨 تظليل</button><button class="rb lbl" data-a="tblBorders">▦ الحدود</button><button class="rb lbl" data-a="hdrRow">صف عنوان</button></div>
    </div>
    <div class="pane" id="p-lay">
      <div class="grp"><select class="rs" id="pgSize" title="حجم الورقة"><option value="A4">A4</option><option value="Letter">Letter</option><option value="A5">A5</option></select>
        <select class="rs" id="pgOri" title="الاتجاه"><option value="p">طولي</option><option value="l">عرضي</option></select>
        <select class="rs" id="pgMar" title="الهوامش"><option value="2.54">عادي 2.54</option><option value="1.27">ضيق 1.27</option><option value="3.18">عريض 3.18</option></select></div>
      <div class="grp"><select class="rs" id="lhSel" title="تباعد الأسطر"><option value="">تباعد الأسطر</option><option value="1">1.0</option><option value="1.15">1.15</option><option value="1.5">1.5</option><option value="2">2.0</option></select>
        <button class="rb lbl" data-a="spcAft">مسافة بعد الفقرة</button><button class="rb lbl" data-a="pbBefore">فاصل قبل الفقرة</button></div>
    </div>
    <div class="pane" id="p-rev">
      <div class="grp"><button class="rb lbl" data-a="find">🔍 بحث واستبدال</button><button class="rb lbl" data-a="count">إحصاء الكلمات</button><button class="rb lbl" data-a="selAll">تحديد الكل</button></div>
    </div>
    <div class="pane" id="p-view">
      <div class="grp"><button class="rb" data-a="zoomOut">－</button><button class="rb" id="zlbl" data-a="zoomReset">100%</button><button class="rb" data-a="zoomIn">＋</button><button class="rb lbl" data-a="fit">ملاءمة العرض</button></div>
      <div class="grp"><button class="rb lbl" data-a="night">🌙 الوضع الليلي</button><button class="rb lbl" data-a="speak">🔊 قراءة</button></div>
    </div>
  </div>
  <div id="findbar">
    <input id="fq" placeholder="بحث"><input id="fr" placeholder="استبدال بـ">
    <button class="rb lbl" data-a="fNext">التالي</button><button class="rb lbl" data-a="fRep">استبدال</button><button class="rb lbl" data-a="fAll">استبدال الكل</button><button class="rb" data-a="fClose">✕</button>
    <span id="fres" style="font-size:12px;color:var(--mut)"></span>
  </div>
  <div id="wrap"><div id="zoomer"><div id="sheet"><div class="hf" id="hdr"></div><div id="page" class="doc" contenteditable="true" spellcheck="false"></div><div class="hf" id="ftr"></div></div></div></div>
  <div id="status"><span id="stWords">0 كلمة</span><span id="stPage"></span><span class="sp"></span><span id="stDirty"></span></div>
</div>
<div id="imgtb"><button class="rb" data-a="imgMinus">－</button><button class="rb" data-a="imgPlus">＋</button><button class="rb" data-a="imgFull">⛶</button><button class="rb" data-a="imgDel">🗑</button></div>
<div id="pal"></div>
<div id="mask"><div id="dlg"></div></div>
<div id="toast"></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const AN = window.Android || {
  getInitialContent: () => '<div class="paper doc"><p>مرحبا بالعالم</p></div>',
  isNight: () => false, onDirty() {}, onExported(m, j) { window.__exported = j; }, toast(s) { console.log('toast', s); },
  pickImage() { window.__pickCalled = true; }, toggleSpeech() {}
};
const page = $('page'), wrap = $('wrap'), sheet = $('sheet');
let dirty = false, zoom = 1, pageNum = false, savedRange = null, curImg = null;
const PG = { size: 'A4', land: false, mar: 2.54 };
const SIZES = { A4: [21, 29.7], Letter: [21.59, 27.94], A5: [14.8, 21] };

/* ---------- أدوات ---------- */
function toast(s) { const t = $('toast'); t.textContent = s; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 1800); }
function markDirty() { if (!dirty) { dirty = true; try { AN.onDirty(true); } catch (e) {} } $('stDirty').textContent = '● غير محفوظ'; scheduleCount(); scheduleSnap(); }
/* ---- تراجع/إعادة مخصّص (لقطات) ---- */
const hist = []; let hi = -1, snapT = null; const imgMap = new Map(), imgRev = [];
function packHtml(h) { return h.replace(/src="(data:[^"]+)"/g, (m, u) => { let id = imgMap.get(u); if (id === undefined) { id = imgRev.length; imgRev.push(u); imgMap.set(u, id); } return 'src="@@' + id + '"'; }); }
function unpackHtml(h) { return h.replace(/src="@@(\d+)"/g, (m, i) => 'src="' + imgRev[+i] + '"'); }
function pathOf(n) { const p = []; while (n && n !== page) { const par = n.parentNode; p.unshift(Array.prototype.indexOf.call(par.childNodes, n)); n = par; } return n === page ? p : null; }
function nodeAt(p) { let n = page; for (const i of p) { n = n && n.childNodes[i]; } return n; }
function curState() { const st = { html: packHtml(page.innerHTML), sel: null }; const s = getSelection(); if (s.rangeCount && page.contains(s.anchorNode)) { const p = pathOf(s.anchorNode); if (p) st.sel = { p, o: s.anchorOffset }; } return st; }
function scheduleSnap() { clearTimeout(snapT); snapT = setTimeout(snapNow, 350); }
function snapNow() { clearTimeout(snapT); snapT = null; const st = curState(); if (hi >= 0 && hist[hi].html === st.html) { hist[hi].sel = st.sel || hist[hi].sel; return; } hist.length = hi + 1; hist.push(st); if (hist.length > 80) hist.shift(); hi = hist.length - 1; }
function restoreState(st) { page.innerHTML = unpackHtml(st.html); if (!page.firstChild) page.innerHTML = '<p><br></p>'; selectImg(null); try { if (st.sel) { const n = nodeAt(st.sel.p); const r = document.createRange(); r.setStart(n, Math.min(st.sel.o, n.nodeType === 3 ? n.length : n.childNodes.length)); r.collapse(true); const s = getSelection(); s.removeAllRanges(); s.addRange(r); savedRange = r.cloneRange(); } } catch (e) {} scheduleCount(); }
function doUndo() { if (snapT) snapNow(); if (hi > 0) { hi--; restoreState(hist[hi]); dirty = true; $('stDirty').textContent = '● غير محفوظ'; } else toast('لا يوجد ما يُتراجع عنه'); }
function doRedo() { if (snapT) snapNow(); if (hi < hist.length - 1) { hi++; restoreState(hist[hi]); } else toast('لا يوجد ما يُعاد'); }
let cntT; function scheduleCount() { clearTimeout(cntT); cntT = setTimeout(() => { const t = (page.innerText || '').trim(); const n = t ? t.split(/\s+/).length : 0; $('stWords').textContent = n + ' كلمة'; }, 300); }
function selInPage() { const s = getSelection(); return s.rangeCount && page.contains(s.anchorNode); }
document.addEventListener('selectionchange', () => { if (selInPage()) savedRange = getSelection().getRangeAt(0).cloneRange(); updateState(); });
function restoreSel() { if (!savedRange) return; page.focus(); const s = getSelection(); s.removeAllRanges(); s.addRange(savedRange); }
function fixLists() { page.querySelectorAll('p > ul, p > ol').forEach(l => { const p = l.parentNode; if (!p.parentNode) return; const rest = [...p.childNodes].filter(n => n !== l && !(n.nodeType === 3 && !n.nodeValue.trim()) && !(n.nodeType === 1 && n.tagName === 'BR')); if (p.getAttribute('dir') && !l.getAttribute('dir')) l.setAttribute('dir', p.getAttribute('dir')); if (p.style.textAlign && !l.style.textAlign) l.style.textAlign = p.style.textAlign; if (!rest.length) p.replaceWith(l); else p.after(l); }); page.querySelectorAll('p:empty').forEach(p => p.remove()); }
function ex(cmd, val) { restoreIfNeeded(); document.execCommand('styleWithCSS', false, true); const r = document.execCommand(cmd, false, val === undefined ? null : val); if (/List$/.test(cmd) || cmd === 'formatBlock') fixLists(); markDirty(); return r; }
function restoreIfNeeded() { if (!selInPage()) restoreSel(); }
function rgbHex(c) { const m = /rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?/.exec(c || ''); if (!m) return null; if (m[4] !== undefined && +m[4] === 0) return null; return [m[1], m[2], m[3]].map(x => (+x).toString(16).padStart(2, '0')).join('').toUpperCase(); }
const BLOCK = new Set(['P', 'DIV', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'UL', 'OL', 'LI', 'TABLE', 'BLOCKQUOTE', 'HR', 'PRE', 'TR', 'TD', 'TH', 'TBODY', 'THEAD', 'TFOOT', 'SECTION', 'ARTICLE', 'FIGURE', 'CAPTION']);

function dlg(title, fields, okText) {
  return new Promise(res => {
    const saved = savedRange;
    const d = $('dlg'); d.innerHTML = '';
    const h = document.createElement('h3'); h.textContent = title; d.appendChild(h);
    const els = {};
    fields.forEach(f => {
      const l = document.createElement('label'); l.textContent = f.label; d.appendChild(l);
      let e;
      if (f.options) { e = document.createElement('select'); f.options.forEach(o => { const op = document.createElement('option'); op.value = o[0]; op.textContent = o[1]; e.appendChild(op); }); }
      else { e = document.createElement('input'); e.type = f.type || 'text'; if (f.min != null) e.min = f.min; if (f.max != null) e.max = f.max; }
      if (f.value != null) e.value = f.value; els[f.id] = e; d.appendChild(e);
    });
    const bt = document.createElement('div'); bt.className = 'bt';
    const ok = document.createElement('button'); ok.className = 'p'; ok.textContent = okText || 'موافق';
    const no = document.createElement('button'); no.textContent = 'إلغاء';
    bt.appendChild(ok); bt.appendChild(no); d.appendChild(bt);
    const done = v => { $('mask').style.display = 'none'; savedRange = saved; res(v); };
    ok.onclick = () => { const v = {}; for (const k in els) v[k] = els[k].value; done(v); };
    no.onclick = () => done(null);
    $('mask').style.display = 'flex';
    const first = d.querySelector('input,select'); if (first) setTimeout(() => first.focus(), 30);
  });
}

/* ---------- لوحة الألوان ---------- */
