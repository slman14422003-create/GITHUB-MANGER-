<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>محرر Excel</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;font:14px/1.3 "Segoe UI",Roboto,"Noto Sans Arabic",Arial,sans-serif;color:#222;-webkit-user-select:none;user-select:none}
button,select,input,textarea{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100%}
#ribbon{flex:none;background:#F3F2F1;border-bottom:1px solid #D2D0CE}
#tabsbar{display:flex;background:#217346;overflow-x:auto;scrollbar-width:none}
#tabsbar::-webkit-scrollbar,#panel::-webkit-scrollbar,#sheettabs::-webkit-scrollbar{display:none}
#tabsbar button{flex:none;border:0;background:none;color:#fff;padding:7px 16px;font-size:14px;opacity:.82}
#tabsbar button.on{background:#F3F2F1;color:#217346;opacity:1;font-weight:600;border-radius:6px 6px 0 0}
#panel{display:flex;overflow-x:auto;padding:5px 6px;gap:4px;align-items:stretch;min-height:76px;scrollbar-width:none}
.grp{flex:none;display:flex;flex-direction:column;border-inline-end:1px solid #D2D0CE;padding:0 6px;justify-content:space-between}
.grp .row{display:flex;gap:2px;align-items:center;flex-wrap:nowrap;min-height:30px}
.grp .gl{font-size:10.5px;color:#777;text-align:center;margin-top:1px}
.btn{flex:none;min-width:32px;height:30px;border:1px solid transparent;background:none;border-radius:5px;padding:0 6px;font-size:15px;display:flex;align-items:center;justify-content:center;gap:3px;white-space:nowrap}
.btn:active,.btn.on{background:#C7E0F4;border-color:#8FC0E8}
.btn.big{flex-direction:column;height:62px;min-width:48px;font-size:20px;gap:0}.btn.big small{font-size:10.5px}
.sel{height:28px;border:1px solid #C8C6C4;border-radius:5px;background:#fff;padding:0 4px;max-width:130px}
.sw{width:18px;height:4px;display:block;margin-top:1px;border-radius:1px}
#fbar{flex:none;display:flex;align-items:center;gap:4px;padding:3px 6px;background:#fff;border-bottom:1px solid #D2D0CE;direction:ltr}
#namebox{width:78px;height:28px;border:1px solid #C8C6C4;border-radius:5px;text-align:center;background:#fff;-webkit-user-select:text;user-select:text}
#fx{flex:none;color:#217346;font-style:italic;font-weight:700;padding:0 4px}
#fin{flex:1;min-width:0;height:28px;border:1px solid #C8C6C4;border-radius:5px;padding:0 8px;background:#fff;-webkit-user-select:text;user-select:text}
#fbar .btn{height:28px}
#gridwrap{flex:1;min-height:0;position:relative;overflow:hidden;background:#fff}
#gridwrap.night{filter:invert(1) hue-rotate(180deg)}
#corner{position:absolute;top:0;inset-inline-start:0;background:#EDEDED;border-bottom:1px solid #C6C6C6;border-inline-end:1px solid #C6C6C6;z-index:6}
#colhdr{position:absolute;top:0;height:24px;overflow:hidden;background:#EDEDED;border-bottom:1px solid #C6C6C6;z-index:5}
#rowhdr{position:absolute;bottom:0;inset-inline-start:0;width:46px;overflow:hidden;background:#EDEDED;border-inline-end:1px solid #C6C6C6;z-index:5}
#colin,#rowin{position:absolute;top:0;left:0}
#gridwrap[dir=rtl] #colin{left:auto;right:0}#gridwrap[dir=rtl] #rowin{left:auto;right:0}
.h{position:absolute;display:flex;align-items:center;justify-content:center;font-size:12px;color:#444;border-inline-end:1px solid #C6C6C6;border-bottom:1px solid #C6C6C6;overflow:hidden}
.h.sel{background:#D3E7D9;color:#107C41;font-weight:700}
.h.fsel{background:#107C41;color:#fff}
.rsz{position:absolute;top:0;bottom:0;inset-inline-end:-4px;width:12px;z-index:2;touch-action:none}
.rszr{position:absolute;left:0;right:0;bottom:-4px;height:12px;z-index:2;touch-action:none}
#scroller{position:absolute;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#inner{position:relative}
#cells{position:absolute;inset:0}
.c{position:absolute;overflow:hidden;white-space:nowrap;padding:0 3px;display:flex;align-items:flex-end;box-shadow:inset -1px -1px 0 #E1E1E1;background:#fff;font-size:14.67px;line-height:1.2;cursor:cell}
.nogrid .c{box-shadow:none}
.c>span{display:block;width:100%;overflow:hidden;text-overflow:clip}
.c.w>span{white-space:pre-wrap;overflow-wrap:anywhere}
.c.w{white-space:normal}
#selbox{position:absolute;pointer-events:none;border:2px solid #107C41;background:rgba(16,124,65,.10);z-index:3;display:none}
#actbox{position:absolute;pointer-events:none;border:2px solid #107C41;z-index:4;display:none}
#handle{position:absolute;width:22px;height:22px;background:#107C41;border:2px solid #fff;border-radius:50%;z-index:7;display:none;touch-action:none}
#speakbox{position:absolute;pointer-events:none;border:2px solid #E8590C;background:rgba(255,213,0,.30);z-index:3;display:none}
#cedit{position:absolute;z-index:8;display:none;border:2px solid #107C41;background:#fff;padding:1px 3px;resize:none;outline:0;overflow:hidden;font-size:14.67px;line-height:1.2;-webkit-user-select:text;user-select:text}
#status{flex:none;display:flex;gap:14px;padding:3px 10px;font-size:12px;color:#444;background:#F3F2F1;border-top:1px solid #D2D0CE;min-height:22px;overflow-x:auto;white-space:nowrap}
#sheettabs{flex:none;display:flex;align-items:stretch;background:#E6E4E1;overflow-x:auto;border-top:1px solid #C8C6C4;scrollbar-width:none}
.stab{flex:none;padding:9px 16px;font-size:14px;color:#444;border-inline-end:1px solid #D2D0CE;white-space:nowrap;background:none;border-top:0;border-bottom:0;border-inline-start:0}
.stab.on{background:#fff;color:#107C41;font-weight:700;box-shadow:inset 0 -3px 0 #107C41}
#sheettabs .add{padding:9px 14px;font-size:18px;color:#107C41;border:0;background:#E6E4E1;position:sticky;inset-inline-start:0}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
#dlg{background:#fff;border-radius:14px;width:100%;max-width:420px;max-height:88vh;overflow:auto;padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
#dlg h3{margin:0 0 10px;font-size:16px}
#dlg label{display:block;margin:8px 0 3px;font-size:13px;color:#555}
#dlg input[type=text],#dlg input[type=number],#dlg select{width:100%;height:36px;border:1px solid #C8C6C4;border-radius:8px;padding:0 10px;background:#fff;-webkit-user-select:text;user-select:text}
#dlg .bt{display:flex;gap:8px;margin-top:14px}
#dlg .bt button{flex:1;height:40px;border-radius:20px;border:1px solid #C8C6C4;background:#fff;font-weight:600}
#dlg .bt button.pri{background:#107C41;color:#fff;border-color:#107C41}
#dlg .menu button{display:block;width:100%;text-align:start;padding:12px 8px;border:0;border-bottom:1px solid #eee;background:none;font-size:15px}
.pal{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:6px 0}
.pal i{display:block;aspect-ratio:1;border-radius:4px;border:1px solid rgba(0,0,0,.2)}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#323130;color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;z-index:60;display:none;max-width:80%}
</style>
</head>
<body>
<div id="app">
  <div id="ribbon"><div id="tabsbar"></div><div id="panel"></div></div>
  <div id="fbar">
    <input id="namebox" type="text" autocomplete="off" spellcheck="false">
    <button class="btn" data-act="selmode" id="selmodeBtn" title="وضع تحديد النطاق">⬚</button>
    <button class="btn" data-act="editcell" title="تحرير الخلية">✎</button>
    <span id="fx">fx</span>
    <input id="fin" type="text" autocomplete="off" spellcheck="false">
  </div>
  <div id="gridwrap">
    <div id="corner"></div>
    <div id="colhdr"><div id="colin"></div></div>
    <div id="rowhdr"><div id="rowin"></div></div>
    <div id="scroller"><div id="inner"><div id="cells"></div><div id="selbox"></div><div id="speakbox"></div><div id="actbox"></div><div id="handle"></div><textarea id="cedit" spellcheck="false"></textarea></div></div>
  </div>
  <div id="status"></div>
  <div id="sheettabs"></div>
</div>
<div id="ov"><div id="dlg"></div></div>
<div id="toast"></div>
<script src="sheet_engine.js"></script>
<script>

}

  return JSON.stringify({
    d1904: wb.d1904, styles,
    sheets: wb.sheets.map(sh => {

  const sc = $('scroller'); sc.setAttribute('dir', sh.rtl ? 'rtl' : 'ltr');
  $('corner').style.cssText = 'width:' + ROW_W + 'px;height:' + COL_H + 'px';
  const ch = $('colhdr'); ch.style.insetInlineStart = ROW_W + 'px'; ch.style.insetInlineEnd = '0'; ch.style.left = ''; ch.style.right = '';
