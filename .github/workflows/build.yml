name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths-ignore: ['**/*.md']
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'نوع البناء'
        type: choice
        options: [release, debug]
        default: release

# Least privilege: the build only needs to read the repo
permissions:
  contents: read

# A newer push cancels the older run of the same branch
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: ${{ inputs.build_type || 'release' }}

jobs:
  build:
    name: Build ${{ inputs.build_type || 'release' }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (API 36 / Android 16)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.14.3'
          cache-cleanup: on-success

      - name: Prepare release signing
        if: env.BUILD_TYPE == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks"
              echo "SIGNING_STORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"
              echo "SIGNING_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "SIGNING_MODE=مفتاح المستودع (الأسرار)" >> "$GITHUB_ENV"
          else
            echo "::warning title=لا توجد أسرار توقيع::لم يتم ضبط KEYSTORE_BASE64. سيُوقَّع التطبيق بمفتاح مؤقت ولن يتحدّث فوق نسخة موقعة بمفتاح آخر. أضف الأسرار من Settings > Secrets and variables > Actions."
            PASS="$(openssl rand -hex 16)"
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore "$RUNNER_TEMP/temp.jks" -storetype PKCS12 \
              -alias temp -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Temporary CI Key"
            {
              echo "SIGNING_STORE_FILE=$RUNNER_TEMP/temp.jks"
              echo "SIGNING_STORE_PASSWORD=$PASS"
              echo "SIGNING_KEY_ALIAS=temp"
              echo "SIGNING_KEY_PASSWORD=$PASS"
            } >> "$GITHUB_ENV"
            echo "SIGNING_MODE=مفتاح مؤقت (غير ثابت)" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then
            gradle assembleRelease --stacktrace --warning-mode all
          else
            gradle assembleDebug --stacktrace --warning-mode all
          fi

      - name: Verify and summarize
        run: |
          APK="$(ls app/build/outputs/apk/${BUILD_TYPE}/*.apk | head -n1)"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/verify.txt" || true
          {
            echo "## ✅ GitHub Manager — $BUILD_TYPE"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| الملف | \`$(basename "$APK")\` |"
            echo "| الحجم | $(du -h "$APK" | cut -f1) |"
            echo "| SHA-256 | \`$(sha256sum "$APK" | cut -d' ' -f1)\` |"
            echo "| التوقيع | ${SIGNING_MODE:-debug} |"
            echo "| Android | compileSdk 36 / targetSdk 36 |"
            echo ""
            echo '```'
            grep -E "Verified|certificate" "$RUNNER_TEMP/verify.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: GitHubManager-${{ env.BUILD_TYPE }}-apk
          path: app/build/outputs/apk/${{ env.BUILD_TYPE }}/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload R8 mapping
        if: env.BUILD_TYPE == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 90

  # Publishes the APK as a GitHub Release when you push a tag such as v2.2
  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GitHubManager-release-apk
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk --repo "$GITHUB_REPOSITORY" --generate-notes
