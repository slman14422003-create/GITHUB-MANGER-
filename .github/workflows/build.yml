name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths-ignore: ['**/*.md']
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'نوع البناء'
        type: choice
        options: [release, debug]
        default: release
      version:
        description: 'رقم الإصدار / الوسم (مثال v2.3) — اتركه فارغًا للترقيم التلقائي'
        type: string
        default: ''
      publish_release:
        description: 'انشر الناتج كإصدار (Release) على GitHub'
        type: boolean
        default: true
      prerelease:
        description: 'علّم الإصدار كنسخة تجريبية (Pre-release)'
        type: boolean
        default: false

# Least privilege: the build job only reads the repo, the release job gets write access itself
permissions:
  contents: read

# A newer push cancels an older run of the same branch, but tag / manual release runs are never cancelled
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}

env:
  BUILD_TYPE: ${{ inputs.build_type || 'release' }}

jobs:
  build:
    name: Build ${{ inputs.build_type || 'release' }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version_name: ${{ steps.meta.outputs.version_name }}
      publish: ${{ steps.meta.outputs.publish }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      version_code: ${{ steps.meta.outputs.version_code }}
    steps:
      - uses: actions/checkout@v6

      # Decide the version and whether to publish a Release. Every successful release build
      # on main / a tag / a manual run is published, so the release step is no longer skipped.
      - name: Resolve version and release plan
        id: meta
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_PUBLISH: ${{ inputs.publish_release }}
          IN_PRE: ${{ inputs.prerelease }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          BASE="$(grep -oP 'versionName\s*=\s*System\.getenv\([^)]*\)\s*\?:\s*"\K[^"]+' app/build.gradle | head -n1)"
          [ -z "$BASE" ] && BASE="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle | head -n1)"
          [ -z "$BASE" ] && BASE="1.0"
          VERSION_CODE=$((10 + GITHUB_RUN_NUMBER))
          PUBLISH=false
          PRE=false
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            PUBLISH=true
          elif [ -n "$IN_VERSION" ]; then
            TAG="$IN_VERSION"
            [[ "$TAG" != v* ]] && TAG="v$TAG"
          else
            TAG="v${BASE}.${GITHUB_RUN_NUMBER}"
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            PUBLISH="${IN_PUBLISH:-true}"
            PRE="${IN_PRE:-false}"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            PUBLISH=true
            # put [skip release] in a commit message to build without publishing a Release
            case "$COMMIT_MSG" in *"[skip release]"*|*"[no release]"*) PUBLISH=false ;; esac
          fi
          if [ "$BUILD_TYPE" != "release" ] || [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            PUBLISH=false
          fi
          VERSION_NAME="${TAG#v}"
          {
            echo "tag=$TAG"
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "publish=$PUBLISH"
            echo "prerelease=$PRE"
          } >> "$GITHUB_OUTPUT"
          echo "APP_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Version: $TAG (code $VERSION_CODE) — publish release: $PUBLISH"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (API 36 / Android 16)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.14.3'
          cache-cleanup: on-success

      - name: Prepare release signing
        id: sign
        if: env.BUILD_TYPE == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ADI_SNIPPET: ${{ secrets.ADI_REGISTRATION_SNIPPET }}
        run: |
          # A release must always be signed with the SAME permanent key. A random temporary key gives a
          # different certificate fingerprint every build, so it can never be registered with Google
          # and the app can never update itself. Stop here instead of silently producing such a build.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error title=مفتاح التوقيع غير مضبوط::أضف الأسرار KEYSTORE_BASE64 و KEYSTORE_PASSWORD و KEY_ALIAS (و KEY_PASSWORD إن وُجدت). شغّل سير العمل Generate signing key مرة واحدة أو راجع SIGNING.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "::add-mask::$KEYSTORE_PASSWORD"
          [ -n "$KEY_PASSWORD" ] && echo "::add-mask::$KEY_PASSWORD"
          {
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"
            echo "SIGNING_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"

          # SHA-256 of the signing certificate (this is what Google asks for, not the hash of the APK file)
          CERT="$(keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -alias "$KEY_ALIAS" \
                    -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep -m1 'SHA256:' | sed 's/.*SHA256:[[:space:]]*//')"
          if [ -z "$CERT" ]; then
            echo "::error title=تعذّر قراءة المفتاح::تأكد من كلمة مرور الملف واسم المفتاح (Alias)."
            exit 1
          fi
          echo "EXPECTED_CERT_SHA256=${CERT//:/}" >> "$GITHUB_ENV"
          echo "SIGNING_MODE=مفتاح المستودع الدائم" >> "$GITHUB_ENV"
          echo "signing_mode=repo-key" >> "$GITHUB_OUTPUT"

          # Optional proof-of-ownership snippet from Play Console (developer verification)
          if [ -n "$ADI_SNIPPET" ]; then
            mkdir -p app/src/main/assets
            printf '%s\n' "$ADI_SNIPPET" > app/src/main/assets/adi-registration.properties
            echo "تمت إضافة adi-registration.properties إلى الـ APK"
          fi

      - name: Build APK
        env:
          VERSION_CODE_OVERRIDE: ${{ steps.meta.outputs.version_code }}
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then
            gradle assembleRelease --stacktrace --warning-mode all
          else
            gradle assembleDebug --stacktrace --warning-mode all
          fi

      - name: Verify and summarize
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          APK_SRC="$(ls app/build/outputs/apk/${BUILD_TYPE}/*.apk | head -n1)"
          mkdir -p dist
          APK="dist/GitHubManager-${TAG}-${BUILD_TYPE}.apk"
          cp "$APK_SRC" "$APK"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/verify.txt"
          CERT_HEX="$(grep -m1 'certificate SHA-256 digest' "$RUNNER_TEMP/verify.txt" | awk '{print $NF}')"
          if [ "$BUILD_TYPE" = "release" ]; then
            if [ -z "$CERT_HEX" ]; then echo "::error::لم يُوقَّع الـ APK"; exit 1; fi
            if [ -n "$EXPECTED_CERT_SHA256" ] && [ "${CERT_HEX,,}" != "${EXPECTED_CERT_SHA256,,}" ]; then
              echo "::error::بصمة شهادة الـ APK لا تطابق بصمة المفتاح المضبوط"; exit 1
            fi
          fi
          CERT_COLON="$(echo "$CERT_HEX" | tr a-f A-F | sed 's/../&:/g; s/:$//')"
          {
            echo "## ✅ GitHub Manager — $BUILD_TYPE"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| الإصدار | \`$TAG\` |"
            echo "| الملف | \`$(basename "$APK")\` |"
            echo "| الحجم | $(du -h "$APK" | cut -f1) |"
            echo "| SHA-256 لملف الـ APK | \`$(sha256sum "$APK" | cut -d' ' -f1)\` |"
            [ "$BUILD_TYPE" = "release" ] && echo "| **SHA-256 لشهادة التوقيع** (سجّلها في Play Console) | \`$CERT_COLON\` |" || true
            echo "| التوقيع | ${SIGNING_MODE:-debug} |"
            echo "| Android | compileSdk 36 / targetSdk 36 |"
            echo ""
            echo '```'
            grep -E "Verified|certificate" "$RUNNER_TEMP/verify.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "- **التوقيع:** ${SIGNING_MODE:-debug}"
            echo "- **SHA-256 (APK):** \`$(sha256sum "$APK" | cut -d' ' -f1)\`"
            [ "$BUILD_TYPE" = "release" ] && echo "- **SHA-256 (شهادة التوقيع):** \`$CERT_COLON\`" || true
            echo "- versionCode: ${{ steps.meta.outputs.version_code }}"
          } > dist/notes-footer.md

      - uses: actions/upload-artifact@v4
        with:
          name: GitHubManager-${{ env.BUILD_TYPE }}-apk
          path: |
            dist/*.apk
            dist/notes-footer.md
          if-no-files-found: error
          retention-days: 30

      - name: Upload R8 mapping
        if: env.BUILD_TYPE == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 90

  # Publishes the APK as a GitHub Release (new tag, or the existing release when the tag already exists)
  release:
    name: Publish GitHub Release
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.build.outputs.tag }}
      PRE: ${{ needs.build.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GitHubManager-release-apk
          path: dist

      - name: Create or update release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # The release already exists (e.g. created from the app): attach the APK and make sure
            # the versionCode footer used by the in-app updater is present.
            gh release upload "$TAG" dist/*.apk --clobber --repo "$GITHUB_REPOSITORY"
            BODY="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body)"
            if ! printf '%s' "$BODY" | grep -q 'versionCode:'; then
              { printf '%s\n\n' "$BODY"; cat dist/notes-footer.md; } > dist/notes-final.md
              gh release edit "$TAG" --notes-file dist/notes-final.md --repo "$GITHUB_REPOSITORY"
            fi
          else
            ARGS=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes --notes-file dist/notes-footer.md)
            [ "$PRE" = "true" ] && ARGS+=(--prerelease)
            gh release create "$TAG" dist/*.apk "${ARGS[@]}"
          fi
