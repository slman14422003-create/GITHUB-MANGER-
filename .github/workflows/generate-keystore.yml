name: Generate signing key

# شغّله مرة واحدة فقط لإنشاء مفتاح التوقيع الدائم.
# يعمل في المستودعات الخاصة (Private) فقط، لأن ملف المفتاح يُرفع كـ Artifact.
on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'اسم المفتاح (Alias)'
        type: string
        default: 'ghmanager'
      common_name:
        description: 'الاسم الذي يظهر في الشهادة (CN)'
        type: string
        default: 'GitHub Manager'

permissions:
  contents: read

jobs:
  keygen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refuse to run on a public repository
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$IS_PRIVATE" != "true" ]; then
            echo "::error title=مستودع عام::مفتاح التوقيع سيكون قابلًا للتنزيل من أي شخص. حوّل المستودع إلى Private أو أنشئ المفتاح على جهازك بالسكربت tools/make-keystore.sh"
            exit 1
          fi

      - name: Create the keystore
        env:
          ALIAS: ${{ inputs.alias }}
          CN: ${{ inputs.common_name }}
        run: |
          set -e
          mkdir -p out
          PASS="$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)"
          echo "::add-mask::$PASS"
          keytool -genkeypair -keystore out/release.jks -storetype PKCS12 \
            -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 36500 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=$CN"
          {
            echo "STORE_PASSWORD=$PASS"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEY_PASSWORD=$PASS"
          } > out/signing-info.txt
          FP="$(keytool -list -v -keystore out/release.jks -alias "$ALIAS" -storepass "$PASS" | grep -m1 'SHA256:' | sed 's/.*SHA256:[[:space:]]*//')"
          {
            echo "## 🔑 تم إنشاء مفتاح التوقيع"
            echo ""
            echo "**SHA-256 للشهادة** (هذه هي البصمة التي تُسجَّل في Play Console):"
            echo ""
            echo "\`$FP\`"
            echo ""
            echo "1. نزّل الـ Artifact باسم **signing-key** (ينتهي بعد يوم واحد)."
            echo "2. من التطبيق: الأسرار ← إعداد مفتاح التوقيع ← اختر release.jks وأدخل البيانات من signing-info.txt."
            echo "3. احتفظ بنسخة احتياطية من الملفين في مكان آمن ثم احذف الـ Artifact. فقدان المفتاح = لا يمكن تحديث التطبيق أبدًا."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: out/
          retention-days: 1
          if-no-files-found: error
